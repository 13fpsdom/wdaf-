name: Build Fake Elytra

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-elytra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Test and build
        run: gradle test build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fake-elytra-jar
          path: |
            fake-elytra/build/libs/*.jar
            !fake-elytra/build/libs/*-sources.jar
